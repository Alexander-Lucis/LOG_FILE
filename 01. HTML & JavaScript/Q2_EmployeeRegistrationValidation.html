Question 2: Employee Registration Form Validation
Question: Create an employee registration form and validate DOB, joining date, and salary using JavaScript.
=============================================================================
-->

<!DOCTYPE html>
<html>
<head>
  <title>Employee Registration</title>
  <script>
    function validateForm() {
      var dob = document.getElementById("dob").value;
      var joining = document.getElementById("joining").value;
      var salary = document.getElementById("salary").value;

      if (dob === "" || joining === "" || salary === "") {
        alert("All fields are required");
        return false;
      }

      var dobDate = new Date(dob);
      var joiningDate = new Date(joining);
      var today = new Date();

      var age = today.getFullYear() - dobDate.getFullYear();
      var month = today.getMonth() - dobDate.getMonth();
      if (month < 0 || (month === 0 && today.getDate() < dobDate.getDate())) {
        age--;
      }

      if (age < 18) {
        alert("Age must be at least 18");
        return false;
      }
      if (joiningDate < dobDate) {
        alert("Joining date cannot be before DOB");
        return false;
      }
      if (joiningDate > today) {
        alert("Joining date cannot be in the future");
        return false;
      }
      if (salary <= 0 || isNaN(salary)) {
        alert("Salary must be greater than 0");
        return false;
      }

      alert("Employee Registration Successful");
      return true;
    }
  </script>
</head>
<body>
  <h2>Employee Registration</h2>
  <form onsubmit="return validateForm()">
    <label>Emp ID:</label><br>
    <input type="text" id="empid"><br><br>
    <label>Emp Name:</label><br>
    <input type="text" id="ename"><br><br>
    <label>Date of Birth:</label><br>
    <input type="date" id="dob"><br><br>
    <label>Joining Date:</label><br>
    <input type="date" id="joining"><br><br>
    <label>Salary:</label><br>
    <input type="number" id="salary"><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
